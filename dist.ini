name    = Async-DBD-Pg
author  = John Napiorkowski <jjnapiork@cpan.org>
license = Artistic_2_0
copyright_holder = John Napiorkowski
copyright_year   = 2026
abstract = Async PostgreSQL client using Future::IO and DBD::Pg
version = 0.001001

[@Basic]
[MetaJSON]

; Stamp $VERSION into every package at build time, so the version lives only
; in this file rather than being repeated in each module.
[PkgVersion]

; Keeps the version and date in Changes correct without editing it by hand.
[NextRelease]

; Development-only files. GatherDir takes everything not pruned, so these
; would otherwise ship to CPAN.
[PruneFiles]
filename = CLAUDE.md
match    = ^docs/

[MetaResources]
homepage = https://github.com/jjn1056/Async-DBD-Pg
bugtracker.web  = https://github.com/jjn1056/Async-DBD-Pg/issues
repository.web  = https://github.com/jjn1056/Async-DBD-Pg
repository.url  = https://github.com/jjn1056/Async-DBD-Pg
repository.type = git

; Prereqs come from the cpanfile, so a checkout and the released metadata
; cannot describe different dependencies.
[Prereqs::FromCPANfile]

[MetaProvides::Package]
[PodSyntaxTests]
[TestRelease]
